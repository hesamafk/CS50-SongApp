<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>🎵 SongBox</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <nav class="navbar">
    <div class="logo">🎧 SongBox</div>
    <div class="nav-links">
      {% if session.username %}
        <span class="welcome">سلام، {{ session.username }}</span>
        <form action="/logout" method="post" class="logout-form"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="btn btn-red" type="submit">خروج</button></form>
      {% else %}
        <a href="/login" class="btn btn-gray">ورود</a>
        <a href="/register" class="btn btn-red">ثبت‌نام</a>
      {% endif %}
    </div>
  </nav>

  <main class="fade-in">
    {% block body %}{% endblock %}
  </main>

  <footer>
    <p>© 2025 SongBox | طراحی شده با ❤️ توسط Hesam</p>
  </footer>

  <script src="/static/script.js"></script>
</body>
</html>
